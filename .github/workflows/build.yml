name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract zip
        run: unzip -q "$(ls *.zip | head -1)" -d src

      - name: Setup local and gradle properties
        run: |
          printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n" > gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: src/Planner

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: |
          cd src/Planner
          chmod +x gradlew || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk
          path: src/Planner/app/build/outputs/apk/debug/*.apk
